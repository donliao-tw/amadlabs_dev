server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/portfolio;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|json|svg)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
