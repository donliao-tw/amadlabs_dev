server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Industrial Excel AI is built and shipped in this image but held back
    # from going live — its backend (iea-backend) isn't deployed yet
    # pending review, so the upload feature would just fail. Block the
    # path explicitly rather than relying on it just not being copied in.
    location /iea/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # No build step / no cache-busted filenames on this site, so a long
    # cache here means visitors silently keep running stale JS/CSS after a
    # deploy until they happen to hard-refresh (bit us: a new button
    # rendered from fresh HTML but called into cached old main.js with no
    # handler for it, and just looked unresponsive). no-cache still lets
    # the browser cache the file, it just revalidates via ETag on every
    # load — a cheap 304 when unchanged, but an instant pickup when it
    # changes, which matters far more than the extra round trip here.
    location ~* \.(?:css|js|json|svg)$ {
        add_header Cache-Control "no-cache";
    }
}
