services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:3000"
    environment:
      - ADMIN_TOKEN=${ADMIN_TOKEN:-amadlabs-dev-token}
    volumes:
      - theme_data:/app/data

volumes:
  theme_data:
