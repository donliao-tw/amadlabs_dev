services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:3000"
    volumes:
      - theme_data:/app/data
      - hs_uploads:/app/uploads
    environment:
      # set in /opt/amadlabs_dev/.env on the server (not in git); empty = upload disabled
      HS_UPLOAD_CODE: ${HS_UPLOAD_CODE:-}

  iea-backend:
    build:
      context: ./iea-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:8000"
    # Stateless: uploads are analyzed in memory and never persisted, so no volume.

volumes:
  theme_data:
  hs_uploads:
