<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>報刀與庫存系統 Demo | AMAD Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
