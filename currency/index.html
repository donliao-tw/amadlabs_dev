<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>幣值換算 | AMAD Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="../" class="logo">
      <span class="logo-mark" aria-hidden="true">A</span>
      <span>AMAD Labs</span>
    </a>
    <nav class="site-nav">
      <a href="../">回到首頁</a>
    </nav>
  </div>
</header>

<main class="currency-main">
  <div class="container">
    <section class="currency-intro">
      <p class="currency-eyebrow">小工具</p>
      <h1>幣值換算</h1>
    </section>

    <div class="currency-card">
      <div class="currency-card-head">
        <button type="button" class="currency-help-btn" id="helpBtn" aria-label="顯示計算公式" aria-expanded="false" title="顯示計算公式">?</button>
        <div class="currency-help-popup" id="helpPopup" hidden>
          比值(每 1 台幣可換遊戲幣) = 10000 ÷ X ÷ 人民幣兌台幣比值 ÷ 信用卡手續費倍數<br>
          總金額(台幣) = 總遊戲幣金額 ÷ 比值<br>
          信用卡回饋(台幣) = 總金額 × 回饋 %<br>
          折扣後比值 = 總遊戲幣金額 ÷ (總金額 − 信用卡回饋)
        </div>
      </div>

      <div class="currency-fields-grid">
        <div class="currency-field">
          <label for="inputX">X(10000 遊戲幣的人民幣價格)</label>
          <input type="number" id="inputX" inputmode="decimal" step="any" placeholder="例如 1.33">
        </div>

        <div class="currency-field">
          <label for="inputRate">人民幣兌台幣比值</label>
          <input type="number" id="inputRate" inputmode="decimal" step="any" value="4.69">
        </div>

        <div class="currency-field">
          <label for="inputFee">信用卡手續費倍數</label>
          <input type="number" id="inputFee" inputmode="decimal" step="any" value="1.045">
        </div>

        <div class="currency-field">
          <label for="inputTotalCurrency">總遊戲幣金額(萬)</label>
          <input type="number" id="inputTotalCurrency" inputmode="decimal" step="any" placeholder="例如 260">
        </div>

        <div class="currency-field currency-field-full">
          <label for="inputReward">信用卡回饋 %</label>
          <input type="number" id="inputReward" inputmode="decimal" step="any" value="3">
        </div>
      </div>

      <div class="currency-results-grid">
        <div class="currency-result currency-result-row1">
          <span class="currency-result-label">總金額(台幣)</span>
          <span class="currency-result-value" id="resultTotal">—</span>
        </div>
        <div class="currency-result currency-result-row1">
          <span class="currency-result-label">信用卡回饋(台幣)</span>
          <span class="currency-result-value" id="resultReward">—</span>
        </div>
        <div class="currency-result currency-result-row2">
          <span class="currency-result-label">比值(遊戲幣/台幣)</span>
          <span class="currency-result-value" id="resultY">—</span>
        </div>
        <div class="currency-result currency-result-row2">
          <span class="currency-result-label">折扣後比值</span>
          <span class="currency-result-value" id="resultNetY">—</span>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <p>© 2026 AMAD Labs. All rights reserved.</p>
  </div>
</footer>

<script>
  var helpBtn = document.getElementById("helpBtn");
  var helpPopup = document.getElementById("helpPopup");
  helpBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    var willOpen = helpPopup.hidden;
    helpPopup.hidden = !willOpen;
    helpBtn.setAttribute("aria-expanded", willOpen ? "true" : "false");
  });
  document.addEventListener("click", function (e) {
    if (!helpPopup.hidden && e.target !== helpBtn) helpPopup.hidden = true;
  });

  var inputX = document.getElementById("inputX");
  var inputRate = document.getElementById("inputRate");
  var inputFee = document.getElementById("inputFee");
  var inputTotalCurrency = document.getElementById("inputTotalCurrency");
  var inputReward = document.getElementById("inputReward");
  var resultY = document.getElementById("resultY");
  var resultTotal = document.getElementById("resultTotal");
  var resultReward = document.getElementById("resultReward");
  var resultNetY = document.getElementById("resultNetY");

  function recalc() {
    var x = parseFloat(inputX.value);
    var rate = parseFloat(inputRate.value);
    var fee = parseFloat(inputFee.value);
    // Field is entered in 萬 (ten-thousands), e.g. 260 means 2,600,000.
    var totalCurrency = parseFloat(inputTotalCurrency.value) * 10000;
    var reward = parseFloat(inputReward.value);

    var y = null;
    if (x && rate && fee) {
      y = 10000 / x / rate / fee;
      resultY.textContent = y.toLocaleString("zh-Hant", { maximumFractionDigits: 4 });
    } else {
      resultY.textContent = "—";
    }

    // Y is "game currency per 1 TWD spent" — so the TWD cost of a given
    // amount of game currency is that amount divided by Y, not multiplied.
    var total = null;
    if (y && totalCurrency) {
      total = totalCurrency / y;
      resultTotal.textContent = "NT$" + total.toLocaleString("zh-Hant", { maximumFractionDigits: 2 });
    } else {
      resultTotal.textContent = "—";
    }

    var rewardAmount = null;
    if (total !== null && reward) {
      rewardAmount = total * (reward / 100);
      resultReward.textContent = "NT$" + rewardAmount.toLocaleString("zh-Hant", { maximumFractionDigits: 2 });
    } else {
      resultReward.textContent = "—";
    }

    // Same "game currency per TWD" ratio, but against the net cost after
    // the cashback comes back — the effective rate you actually paid.
    if (total !== null && rewardAmount !== null && totalCurrency) {
      var netTotal = total - rewardAmount;
      var netY = netTotal ? totalCurrency / netTotal : null;
      resultNetY.textContent = netY
        ? netY.toLocaleString("zh-Hant", { maximumFractionDigits: 4 })
        : "—";
    } else {
      resultNetY.textContent = "—";
    }
  }

  [inputX, inputRate, inputFee, inputTotalCurrency, inputReward].forEach(function (el) {
    el.addEventListener("input", recalc);
  });
</script>

</body>
</html>
